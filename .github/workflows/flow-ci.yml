name: Dramaturgy Workbench CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/dramaturgy-workbench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-flow.txt
      - run: pip install -r requirements-flow.txt pytest pytest-asyncio
        working-directory: backend
      - run: python -m pytest -q tests
        working-directory: backend
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: 'true'
      - run: npm run build
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: dramaturgy-frontend
          path: frontend/build
